<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sondage cl&ocirc;tur&eacute; &mdash; Concours PNJ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap');
  :root { --teal:#1F6481; --teal-deep:#16475c; --lime:#D7E337; --encre:#142228; --blanc:#ffffff; }
  * { box-sizing:border-box; margin:0; padding:0 }
  body {
    font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    background:var(--teal); color:var(--encre);
    display:flex; flex-direction:column; min-height:100vh;
    align-items:center; justify-content:center; padding:28px 24px; gap:18px;
    position:relative;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background:
      radial-gradient(circle at 50% -10%, rgba(215,227,55,.10) 0%, transparent 45%),
      linear-gradient(180deg, transparent 60%, rgba(20,34,40,.18) 100%);
    pointer-events:none;
  }
  .logo { width:64px; height:auto; filter:drop-shadow(0 2px 6px rgba(0,0,0,.2)) }
  .card { background:var(--blanc); border-radius:16px; max-width:360px; width:100%; padding:36px 28px; text-align:center; box-shadow:0 8px 30px rgba(20,34,40,.25); }
  h1 { font-size:21px; font-weight:700; letter-spacing:-.01em; margin-bottom:10px }
  p  { font-size:14px; color:var(--teal-deep); line-height:1.55; opacity:.85 }
  p + p { margin-top:10px }
  .btn { max-width:360px; width:100%; padding:16px; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; text-decoration:none; display:block; text-align:center; background:var(--lime); color:var(--encre); transition:transform .1s, filter .15s; }
  .btn:active { transform:scale(.985) }
  .btn:hover { filter:brightness(.96) }
  .contact { font-size:14px; color:rgba(255,255,255,.75); text-align:center; }
  .contact a { color:var(--blanc); font-weight:700; text-decoration:underline; }
  .footer { font-size:10.5px; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.14em; }
</style>
</head>
<body>
  <img src="/assets/Logo_feuille.png" alt="Parc naturel du Jorat" class="logo">
  <div class="card">
    <h1>Le sondage est d&eacute;sormais cl&ocirc;tur&eacute;</h1>
    <p>En raison d&rsquo;un fort taux de participation, notre sondage n&rsquo;accepte plus de nouvelles r&eacute;ponses.</p>
    <p>Merci chaleureusement pour votre intention d&rsquo;y participer&nbsp;!</p>
  </div>
  <a class="btn" href="https://jorat.org">D&eacute;couvrir le Parc du Jorat</a>
  <div class="contact">Une question&nbsp;? &Eacute;crivez-nous &agrave; <a href="mailto:info@jorat.org">info@jorat.org</a></div>
  <div class="footer">Association Jorat Parc naturel</div>
</body>
</html>
