<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#EDE9DF"/>
    <stop offset="100%" stop-color="#E1DACB"/>
  </linearGradient>
</defs>
<rect width="400" height="400" fill="url(#bg2)"/>

<!-- ground -->
<line x1="40" y1="320" x2="360" y2="320" stroke="#9B968C" stroke-width="1.2" stroke-dasharray="2 4"/>

<!-- posts -->
<g stroke="#33414C" stroke-width="6" stroke-linecap="round">
  <line x1="120" y1="320" x2="120" y2="150"/>
  <line x1="280" y1="320" x2="280" y2="120"/>
</g>

<!-- back panel -->
<rect x="120" y="180" width="160" height="140" fill="none" stroke="#33414C" stroke-width="2.2"/>

<!-- monopitch roof -->
<path d="M95 150 L305 118 L320 132 L110 166 Z" fill="none" stroke="#FF5A1F" stroke-width="2.6" stroke-linejoin="round"/>

<!-- bench inside -->
<rect x="140" y="270" width="120" height="10" rx="3" fill="none" stroke="#33414C" stroke-width="2"/>
<g stroke="#33414C" stroke-width="2" stroke-linecap="round">
  <line x1="150" y1="280" x2="150" y2="300"/>
  <line x1="250" y1="280" x2="250" y2="300"/>
</g>

<!-- side panel hint -->
<path d="M120 190 L95 200 L95 320 L120 320" fill="none" stroke="#33414C" stroke-width="2"/>

<!-- dimension: width -->
<g stroke="#6E6A62" stroke-width="1" fill="none">
  <line x1="95" y1="345" x2="320" y2="345"/>
  <line x1="95" y1="337" x2="95" y2="353"/>
  <line x1="320" y1="337" x2="320" y2="353"/>
</g>
<text x="207" y="365" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#6E6A62">LARGEUR</text>

<!-- dimension: height -->
<g stroke="#6E6A62" stroke-width="1" fill="none">
  <line x1="60" y1="320" x2="60" y2="120"/>
  <line x1="52" y1="320" x2="68" y2="320"/>
  <line x1="52" y1="120" x2="68" y2="120"/>
</g>
<text x="60" y="105" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#6E6A62">H</text>

<text x="200" y="40" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="1" fill="#33414C">VUE EN PLAN — ELEVATION</text>
<text x="200" y="60" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" letter-spacing="1" fill="#9B968C">SCHEMA GENERIQUE</text>
</svg>
